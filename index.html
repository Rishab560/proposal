<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rishabh ❤️ Saumya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  height: 100vh;
  margin: 0;
  background: url("us.jpeg") no-repeat center center fixed;
  background-size: cover;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

.container {
  position: relative;
  width: 100vw;
  height: 100vh;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 40px;
  backdrop-filter: brightness(0.9);
}

/* Top content */
h1, h2, .challenge {
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

h1 { font-size: 32px; margin-bottom: 5px; }
h2 { font-size: 22px; margin-bottom: 5px; }

.challenge {
  font-size: 14px;
  margin-bottom: 25px;
  opacity: 0.9;
}

button {
  padding: 12px 28px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
  z-index: 10;
}

#yesBtn {
  background-color: #ff4d88;
  color: white;
}

#noBtn {
  background-color: #555;
  color: white;
  position: absolute;
}

/* Bottom content */
.second-content {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 40px;
  display: none;
  z-index: 5;
}

.love {
  font-size: 36px;
  font-weight: bold;
  color: #fff;
  margin-bottom: 10px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}

.message {
  font-size: 16px;
  color: #fff;
  line-height: 1.4;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: floatUp 4s linear forwards;
  color: #ff3366;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="container" id="container">
  <h1>Saumya 💖</h1>
  <h2>Will you be my wife? 💍</h2>
  <div class="challenge">I bet you can’t say no 😉</div>

  <button id="yesBtn">Yes ❤️</button>
  <button id="noBtn">No ❌</button>

  <div class="second-content" id="secondContent">
    <div class="love">Rishabh ❤️ Saumya</div>
    <div class="message">
      This is the beginning of our forever 🥰✨<br>
      I promise to respect you, stay honest and loyal, and be with you till the very end 💍
    </div>
  </div>

  <audio id="song">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
  </audio>
</div>

<script>
const container = document.getElementById("container");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const secondContent = document.getElementById("secondContent");
const song = document.getElementById("song");

const MARGIN = 20;

/* Ensure No button moves within container */
function moveNoButton() {
  const containerRect = container.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxX = containerRect.width - btnRect.width - MARGIN;
  const maxY = containerRect.height - btnRect.height - MARGIN;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNoButton();
}, { passive: false });

yesBtn.addEventListener("click", () => {
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
  secondContent.style.display = "block";
  song.play();
  startHearts();
});

function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }, 350);
}

/* Initial placement */
moveNoButton();
</script>

</body>
</html>

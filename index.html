<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Saumya 💍</title>

<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdee9, #b5fffc);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
  }

  .container {
    padding: 20px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 30px;
  }

  button {
    padding: 12px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  #yes {
    background: #ff4d6d;
    color: white;
    margin-right: 10px;
  }

  #no {
    background: #adb5bd;
    color: black;
    position: absolute;
  }

  .message {
    margin-top: 30px;
    font-size: 1.1rem;
    display: none;
  }

  .heart {
    position: fixed;
    bottom: 0;
    font-size: 20px;
    animation: floatUp 4s linear forwards;
  }

  @keyframes floatUp {
    to {
      transform: translateY(-110vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Saumya, will you be my wife? 💍</h1>
  <button id="yes">Yes 💖</button>
  <button id="no">No 😅</button>

  <div class="message" id="message">
    <h2>Rishabh ❤️ Saumya</h2>
    <p>
      I promise to respect you, stay honest and loyal,  
      and be with you till the very end 💍
    </p>
  </div>
</div>

<audio id="music">
  <source src="instrumentalK3g320kbps.mp3" type="audio/mpeg">
</audio>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const music = document.getElementById("music");
  const message = document.getElementById("message");

  // initial NO position
  moveNo();

  function moveNo() {
    const margin = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - margin;
    const maxY = window.innerHeight - noBtn.offsetHeight - margin;

    const x = Math.random() * maxX + margin;
    const y = Math.random() * maxY + margin;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  // works for mobile + desktop
  noBtn.addEventListener("touchstart", moveNo);
  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("click", moveNo);

  yesBtn.addEventListener("click", () => {
    music.play(); // plays ONLY after click → mobile safe
    message.style.display = "block";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    createHearts();
  });

  function createHearts() {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 20) + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 4000);
    }, 300);
  }
</script>

</body>
</html>
